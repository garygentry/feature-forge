name: Bug report
description: Something in feature-forge is not doing what its docs say it does
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Two pieces of context up front make the report
        actionable without a round-trip: the `doctor` output, and which host/adapter
        you were running.

  - type: textarea
    id: summary
    attributes:
      label: What happened, and what did you expect?
      description: |
        A short factual summary. If you have a minimal repro (a command, a config
        snippet, a fixture), name it here.
      placeholder: |
        Running `/feature-forge:forge-5-loop widget` on a fresh clone stops at the
        1c gate saying `runner-binary` failed, but `rauf` is on PATH.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: '`doctor --json` output'
      description: |
        Paste the output of `python3 scripts/forge-session.py doctor --json`
        (or `/feature-forge:forge-guide --doctor` for the human report).
        It tells us the state of every check — remedies, tiers, evidence.
      render: json
      placeholder: |
        {
          "checksSummary": { "ok": ..., "warn": ..., ... },
          ...
        }
    validations:
      required: true

  - type: input
    id: host
    attributes:
      label: Host and adapter
      description: |
        The coding agent you were running and the adapter you have installed —
        e.g. `Claude Code (adapters/claude)`, `codex-cli 0.147 (adapters/codex)`,
        `pi 0.84 (adapters/pi)`. Same wording the `interaction-mode` check uses.
      placeholder: 'Claude Code 2.1 (adapters/claude)'
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: 'feature-forge, rauf (if any), and OS. `git log -1 --oneline` for a from-source install.'
      placeholder: 'feature-forge 0.19.0, rauf 0.15.0, Ubuntu 22.04'
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: 'Logs, screenshots, transcripts, the shape of the failure — whatever helps.'
    validations:
      required: false
